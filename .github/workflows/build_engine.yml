name: Build Mox Engine & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 and MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-SDL2_ttf

      - name: Verify g++ and SDL2
        run: |
          g++ --version
          pkg-config --modversion sdl2

      - name: Compile Mox Engine C++ Source
        run: |
          set -e

          # ─── Resolve paths ────────────────────────────────────────
          if [ -d "Engine/src" ]; then
            SRC_DIR="Engine/src"
          else
            SRC_DIR="src"
          fi

          if [ -d "Engine/third_party" ]; then
            THIRD_PARTY="Engine/third_party"
          else
            THIRD_PARTY="third_party"
          fi

          BUILD_DIR="Engine/build"
          mkdir -p "$BUILD_DIR"

          echo "Source dir  : $SRC_DIR"
          echo "Build dir   : $BUILD_DIR"

          # ─── SDL2 flags from MSYS2 pkg-config ─────────────────────
          SDL2_CFLAGS=$(pkg-config --cflags sdl2 SDL2_image SDL2_mixer SDL2_ttf 2>/dev/null || echo "-I/mingw64/include/SDL2")
          SDL2_LIBS=$(pkg-config --libs   sdl2 SDL2_image SDL2_mixer SDL2_ttf 2>/dev/null || echo "-lmingw32 -lSDL2main -lSDL2")

          # ─── Compiler flags ────────────────────────────────────────
          CXXFLAGS="-std=c++17 -O2 -w \
            -I $SRC_DIR \
            -I $THIRD_PARTY/stb \
            -I $THIRD_PARTY/nlohmann \
            $SDL2_CFLAGS"

          echo "CXXFLAGS: $CXXFLAGS"
          echo "SDL2_LIBS: $SDL2_LIBS"

          # ─── Compile all .cpp files ────────────────────────────────
          find "$SRC_DIR" -name "*.cpp" | while read -r file; do
            name=$(basename "${file%.cpp}")
            obj="$BUILD_DIR/${name}.o"
            echo "  Compiling: $file -> $obj"
            g++ $CXXFLAGS -c "$file" -o "$obj"
          done

          # ─── Link MoxEngine.exe ────────────────────────────────────
          echo "Linking MoxEngine.exe..."
          g++ "$BUILD_DIR"/*.o -o "$BUILD_DIR/MoxEngine.exe" \
            $SDL2_LIBS \
            -lm -ldinput8 -ldxguid -ldxerr8 -luser32 -lgdi32 \
            -lwinmm -limm32 -lole32 -loleaut32 -lshell32 \
            -lsetupapi -lversion -luuid -lhid -lopengl32

          echo "Linked successfully!"

          # ─── Copy SDL2 DLLs from MSYS2 ────────────────────────────
          MINGW_BIN="/mingw64/bin"
          for dll in SDL2.dll SDL2_image.dll SDL2_mixer.dll SDL2_ttf.dll; do
            if [ -f "$MINGW_BIN/$dll" ]; then
              cp "$MINGW_BIN/$dll" "$BUILD_DIR/"
              echo "Copied $dll"
            fi
          done

          # ─── Copy scripts and assets ───────────────────────────────
          for dir in "Engine/scripts" "scripts"; do
            if [ -d "$dir" ]; then
              cp -r "$dir" "$BUILD_DIR/scripts"
              break
            fi
          done

          for dir in "Engine/assets" "assets"; do
            if [ -d "$dir" ]; then
              cp -r "$dir" "$BUILD_DIR/assets"
              break
            fi
          done

          echo ""
          echo "Build complete! Contents of Engine/build:"
          ls -lh "$BUILD_DIR"

      - name: Bundle into MoxEngine.zip
        shell: powershell
        run: |
          Compress-Archive -Path "Engine/build/*" -DestinationPath "MoxEngine.zip" -Force
          Write-Host "MoxEngine.zip created — $($(Get-Item MoxEngine.zip).Length / 1MB) MB"

      - name: Publish GitHub Release (v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Mox Engine v1.0.0"
          body: |
            ## ⚡ Mox Engine v1.0.0 Official Release

            Pre-compiled hardware-accelerated Mox Engine for Windows x64.

            ### 📦 Included Files:
            - `MoxEngine.exe` — DirectX 11 & OpenGL Dual Graphics Engine
            - `SDL2.dll`, `SDL2_image.dll`, `SDL2_mixer.dll`, `SDL2_ttf.dll` — SDL2 Runtimes
            - `scripts/` — NovaScript Interpreter scripts

            ### 🚀 Usage with Mox HUB:
            Download and install directly from Mox HUB using the GitHub Release asset URL.
          draft: false
          prerelease: false
          files: MoxEngine.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
